<!doctype html>
<!--
  Weekly progress report — self-contained (inline CSS/JS, no external deps).
  /lint fills the JSON in <script id="report-data">. Everything else stays untouched.
  Charts are hand-rolled inline SVG so the file renders as a standalone Artifact.
  Design: theme-aware (prefers-color-scheme), colorblind-safe palette, wide charts
  scroll horizontally on mobile. Hit/miss uses fill+shape, never color alone.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Progress</title>
<style>
  :root{
    --bg:#fbfbfa; --card:#fff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e6e4df;
    --gym:#0e7c86; --weight:#2563eb; --steps:#c2740c; --jobs:#7c3aed;
    --good:#0e7c86; --miss:#b9b6ae; --pr:#d4a017;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#16161a; --card:#1e1e24; --ink:#f2f1ee; --muted:#a2a0a6; --line:#33333c;
      --gym:#3fd0c9; --weight:#6ea8ff; --steps:#f0a94b; --jobs:#b98cff;
      --good:#3fd0c9; --miss:#4a4a54; --pr:#f5c542;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;padding:24px 16px 48px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:22px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 18px 16px;margin:0 0 16px}
  .card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px;font-weight:600}
  .tag{font-size:11px;color:var(--muted);font-weight:500}
  .summary{font-size:15px;line-height:1.6}
  .improve{border-left:3px solid var(--steps);padding:10px 14px;border-radius:0 8px 8px 0;
    background:color-mix(in srgb,var(--steps) 8%,transparent);margin-top:4px}
  .improve b{color:var(--steps)}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  svg{display:block}
  .lift{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;
    padding:8px 0;border-top:1px solid var(--line)}
  .lift:first-of-type{border-top:0}
  .lift .n{font-weight:600;font-size:14px}
  .lift .last{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
  .lift .pr{color:var(--pr);font-weight:700}
  .dots{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .dot{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);min-width:34px}
  .pip{width:18px;height:18px;border-radius:50%}
  .pip.on{background:var(--good)}
  .pip.off{background:transparent;border:2px solid var(--miss)}
  .stat{display:inline-flex;flex-direction:column;margin-right:22px}
  .stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .note{font-size:12.5px;color:var(--muted);margin-top:10px}
  .note code{background:color-mix(in srgb,var(--muted) 16%,transparent);
    padding:1px 5px;border-radius:5px;font-size:12px}
  .legend{font-size:11px;color:var(--muted);margin-top:8px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Weekly Progress</h1>
  <div class="sub" id="week"></div>

  <div class="card">
    <h2>Summary</h2>
    <div class="summary" id="summary"></div>
    <div class="improve" id="improve"></div>
  </div>

  <div class="card">
    <h2>Gym — progression <span class="tag">the one that matters</span></h2>
    <div id="lifts"></div>
    <div class="legend">Top working-set load per session. <span style="color:var(--pr)">★</span> = PR this week.</div>
  </div>

  <div class="card">
    <h2>Gym — adherence this week</h2>
    <div class="dots" id="adherence"></div>
    <div class="legend" id="cardio"></div>
  </div>

  <div class="card">
    <h2>Weight <span class="tag">trend is the truth, not the daily swing</span></h2>
    <div class="scroll" id="weight"></div>
  </div>

  <div class="card">
    <h2>Steps</h2>
    <div id="steps"></div>
  </div>

  <div class="card">
    <h2>Job hunt</h2>
    <div id="jobs"></div>
  </div>

  <footer>Generated by /lint · glance, don't study.</footer>
</div>

<script id="report-data" type="application/json">
{
  "week": "W## (Mon DD–DD)",
  "summary": "One honest paragraph: what the body + work week actually looked like.",
  "improve": "The single highest-leverage fix for next week.",
  "weight": { "goalLo": 200, "goalHi": null, "unit": "lb",
    "points": [ {"d":"07-13","w":226}, {"d":"07-14","w":219.6} ] },
  "lifts": [
    {"name":"Bench","unit":"lb","pr":false,
     "points":[{"label":"7/13","load":155,"reps":"5×4"}]}
  ],
  "adherence": {
    "lifts":[{"day":"Mon","type":"Push A","done":true}],
    "cardioDone":1, "cardioTarget":3
  },
  "steps": { "numeric":false,
    "days":[{"day":"Mon","hit":true}], "counts":[] },
  "jobs": { "numeric":false,
    "days":[{"day":"Mon","hit":true}],
    "funnel":null }
}
</script>

<script>
(function(){
  const D = JSON.parse(document.getElementById('report-data').textContent);
  const $ = id => document.getElementById(id);
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  $('week').textContent = D.week || '';
  $('summary').textContent = D.summary || '';
  $('improve').innerHTML = '<b>Improve:</b> ' + (D.improve || '—');

  // ---- sparkline (thin line, last-value dot) ----
  function spark(vals, color, w, h){
    if(!vals.length) return '';
    if(vals.length===1){ // single session: a lone dot
      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><circle cx="${w-6}" cy="${h/2}" r="4" fill="${color}"/></svg>`;
    }
    const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1, pad=6;
    const x=i=>pad+i*(w-2*pad)/(vals.length-1);
    const y=v=>h-pad-(v-min)/span*(h-2*pad);
    const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const lx=x(vals.length-1).toFixed(1), ly=y(vals[vals.length-1]).toFixed(1);
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`+
      `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`+
      `<circle cx="${lx}" cy="${ly}" r="3.2" fill="${color}"/></svg>`;
  }

  // ---- gym progression ----
  const lifts = D.lifts||[];
  $('lifts').innerHTML = lifts.length ? lifts.map(l=>{
    const pts=(l.points||[]);
    const loads=pts.map(p=>p.load).filter(v=>typeof v==='number');
    const last=pts[pts.length-1]||{};
    const lastStr = last.load!=null ? `${last.load}${l.unit||''}${last.reps?' · '+last.reps:''}` : '—';
    return `<div class="lift"><div class="n">${l.name}${l.pr?' <span class="pr">★</span>':''}</div>`+
      `<div class="scroll">${spark(loads, css('--gym'), 180, 30)}</div>`+
      `<div class="last">${lastStr}</div></div>`;
  }).join('') : '<div class="note">No lifts logged yet this week.</div>';

  // ---- adherence dots ----
  const a=D.adherence||{}; const al=a.lifts||[];
  $('adherence').innerHTML = al.length ? al.map(x=>
    `<div class="dot"><div class="pip ${x.done?'on':'off'}"></div>${x.day}<br><span style="opacity:.7">${(x.type||'').split(' ')[0]}</span></div>`
  ).join('') : '<div class="note">No sessions logged.</div>';
  if(a.cardioTarget!=null)
    $('cardio').innerHTML = `Cardio: <b>${a.cardioDone||0}/${a.cardioTarget}</b> sessions · ●=hit ○=missed`;

  // ---- weight line chart ----
  function lineChart(points, opts){
    const W=Math.max(340, points.length*70), H=160, pad={l:38,r:14,t:14,b:26};
    const ws=points.map(p=>p.w);
    let lo=Math.min(...ws), hi=Math.max(...ws);
    if(opts.goalLo!=null) lo=Math.min(lo,opts.goalLo);
    const span=(hi-lo)||1; lo-=span*0.15; hi+=span*0.15;
    const x=i=>pad.l+i*(W-pad.l-pad.r)/Math.max(1,points.length-1);
    const y=v=>H-pad.b-(v-lo)/(hi-lo)*(H-pad.t-pad.b);
    const line=points.map((p,i)=>`${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join(' ');
    const col=opts.color, muted=css('--muted'), lc=css('--line');
    let g='';
    if(opts.goalLo!=null){
      const gy=y(opts.goalLo).toFixed(1);
      g=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${gy}" y2="${gy}" stroke="${muted}" stroke-width="1" stroke-dasharray="4 4"/>`+
        `<text x="${W-pad.r}" y="${gy-4}" text-anchor="end" font-size="10" fill="${muted}">goal ${opts.goalLo}</text>`;
    }
    const dots=points.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="3" fill="${col}"/>`).join('');
    const labels=points.map((p,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="${muted}">${p.d}</text>`).join('');
    const yTicks=[hi,(hi+lo)/2,lo].map(v=>`<text x="4" y="${(y(v)+3).toFixed(1)}" font-size="10" fill="${muted}">${v.toFixed(0)}</text>`).join('');
    const first=points[0].w, lastp=points[points.length-1].w, dlt=(lastp-first);
    const dTxt=`${dlt>0?'+':''}${dlt.toFixed(1)} ${opts.unit} over ${points.length} days`;
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="min-width:${W}px">`+
      `<line x1="${pad.l}" x2="${W-pad.r}" y1="${H-pad.b}" y2="${H-pad.b}" stroke="${lc}"/>`+
      g+yTicks+
      `<polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`+
      dots+labels+
      `<text x="${pad.l}" y="12" font-size="11" fill="${col}" font-weight="600">${dTxt}</text></svg>`;
  }
  const wp=(D.weight&&D.weight.points)||[];
  $('weight').innerHTML = wp.length>1
    ? lineChart(wp, {color:css('--weight'), goalLo:D.weight.goalLo, unit:D.weight.unit||'lb'})
    : '<div class="note">Not enough weigh-ins this week to draw a trend.</div>';

  // ---- reusable hit/miss strip ----
  function strip(days){
    return `<div class="dots">`+days.map(x=>
      `<div class="dot"><div class="pip ${x.hit?'on':'off'}"></div>${x.day}</div>`
    ).join('')+`</div>`;
  }

  // ---- steps ----
  const s=D.steps||{};
  if(s.numeric && (s.counts||[]).length>1){
    $('steps').innerHTML = lineChart(s.counts.map(c=>({d:c.day,w:c.count})),
      {color:css('--steps'), goalLo:s.goal||null, unit:'k'});
  } else {
    const days=s.days||[];
    $('steps').innerHTML = (days.length?strip(days):'')+
      `<div class="note">Numeric step counts aren't logged yet — showing 15K-target hit/miss.
       To chart the real trend, add one field to each daily note:
       <code>metrics: steps=16.2</code> (thousands). /lint reads it next week.</div>`;
  }

  // ---- jobs ----
  const j=D.jobs||{};
  if(j.numeric && j.funnel){
    const f=j.funnel;
    const cell=(k,v)=>`<span class="stat"><span class="v">${v}</span><span class="k">${k}</span></span>`;
    $('jobs').innerHTML =
      cell('apps',f.apps??0)+cell('humans',f.humans??0)+cell('interviews',f.interviews??0)+cell('artifacts',f.artifacts??0);
  } else {
    const days=j.days||[];
    $('jobs').innerHTML = (days.length?strip(days):'')+
      `<div class="note">The funnel (apps · humans · interviews · artifacts) isn't logged yet —
       showing daily job-rep hit/miss. To track the funnel, add to each daily note:
       <code>metrics: apps=9 humans=1 interviews=0 artifacts=0</code>. /lint reads it next week.</div>`;
  }
})();
</script>
</body>
</html>
